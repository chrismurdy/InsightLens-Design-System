<!-- @startingPoint section="Website" subtitle="insightlens.com marketing site recreation" viewport="1400x900" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InsightLens | Envision USA — site kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  @keyframes il-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  body { min-width: 1320px; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>window.__DS_ROOT = "../../";</script>
<script src="../_dev_shim.js"></script>
<script>
Promise.resolve(window.__DS_READY)
  .then(function () {
    return window.__dsLoad([
      "SiteChrome.jsx", "HomeScreen.jsx", "PlatformScreen.jsx",
      "ScansScreen.jsx", "AboutScreen.jsx", "ContactScreen.jsx",
    ]);
  })
  .then(function () {
    var App = eval(Babel.transform([
      "function App() {",
      "  var s = React.useState('home'); var screen = s[0], set = s[1];",
      "  React.useEffect(function(){ window.scrollTo(0,0); }, [screen]);",
      "  var go = function (id) { set(id); };",
      "  return (",
      "    <React.Fragment>",
      "      <SiteHeader current={screen} onNavigate={go} />",
      "      {screen === 'home' ? <HomeScreen onNavigate={go} /> : null}",
      "      {screen === 'platform' ? <PlatformScreen onNavigate={go} /> : null}",
      "      {screen === 'scans' ? <ScansScreen onNavigate={go} /> : null}",
      "      {screen === 'about' ? <AboutScreen onNavigate={go} /> : null}",
      "      {screen === 'contact' ? <ContactScreen /> : null}",
      "      <SiteFooter onNavigate={go} />",
      "    </React.Fragment>",
      "  );",
      "}",
      "App;",
    ].join("\n"), { presets: [["react", { runtime: "classic" }]], sourceType: "script" }).code);
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  })
  .catch(function (e) { console.error(e); });
</script>
</body>
</html>
