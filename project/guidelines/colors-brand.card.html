<!-- @dsCard group="Colors" viewport="700x140" name="Brand core" subtitle="Signal gold and Envision navy — the two marks of the lockup" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--il-gold-500)"></div><div class="lbl">Gold 500</div><div class="hex">--il-gold-500</div></div><div class="sw"><div class="chip" style="background:var(--il-gold-400)"></div><div class="lbl">Gold 400</div><div class="hex">--il-gold-400</div></div><div class="sw"><div class="chip" style="background:var(--il-gold-200)"></div><div class="lbl">Gold 200</div><div class="hex">--il-gold-200</div></div><div class="sw"><div class="chip" style="background:var(--il-gold-050)"></div><div class="lbl">Gold 050</div><div class="hex">--il-gold-050</div></div><div class="sw"><div class="chip" style="background:var(--il-navy-500)"></div><div class="lbl">Navy 500</div><div class="hex">--il-navy-500</div></div><div class="sw"><div class="chip" style="background:var(--il-navy-300)"></div><div class="lbl">Navy 300</div><div class="hex">--il-navy-300</div></div><div class="sw"><div class="chip" style="background:var(--il-navy-100)"></div><div class="lbl">Navy 100</div><div class="hex">--il-navy-100</div></div><div class="sw"><div class="chip" style="background:var(--il-navy-050)"></div><div class="lbl">Navy 050</div><div class="hex">--il-navy-050</div></div>
</div></body></html>
