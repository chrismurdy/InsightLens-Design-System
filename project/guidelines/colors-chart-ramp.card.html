<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
.bar{height:64px;flex:1;border-radius:var(--il-radius-sm)}</style></head><body>
<div class="row" style="gap:6px">
<div style="flex:1"><div class="bar" style="background:var(--il-chart-1)"></div><div class="lbl">Series 1</div></div><div style="flex:1"><div class="bar" style="background:var(--il-chart-2)"></div><div class="lbl">Series 2</div></div><div style="flex:1"><div class="bar" style="background:var(--il-chart-3)"></div><div class="lbl">Series 3</div></div><div style="flex:1"><div class="bar" style="background:var(--il-chart-4)"></div><div class="lbl">Series 4</div></div><div style="flex:1"><div class="bar" style="background:var(--il-chart-5)"></div><div class="lbl">Series 5</div></div><div style="flex:1"><div class="bar" style="background:var(--il-chart-6)"></div><div class="lbl">Series 6</div></div>
</div></body></html>
