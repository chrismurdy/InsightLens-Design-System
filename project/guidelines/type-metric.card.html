<!-- @dsCard group="Type" viewport="700x150" name="Metrics" subtitle="Dashboard numerals in the display face with a two-line label" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
</style></head><body>
<div style="display:flex;gap:56px;align-items:flex-start">
  <div><div class="il-metric" style="font-size:56px">497</div><div class="il-small" style="color:var(--il-text-secondary);max-width:12ch">Number of Locations</div></div>
  <div><div class="il-metric" style="font-size:56px">30</div><div class="il-small" style="color:var(--il-text-secondary);max-width:12ch">Locations Count</div></div>
  <div><div class="il-metric" style="font-size:56px">477</div><div class="il-small" style="color:var(--il-text-secondary);max-width:12ch">Assets Count</div></div>
</div></body></html>
