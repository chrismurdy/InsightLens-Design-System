<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="Square buttons, 12px media, pills only for prompt fields and avatars" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
</style></head><body>
<div class="row" style="gap:20px">
<div style="width:120px"><div style="height:60px;background:var(--il-grey-100);border:1px solid var(--il-line-strong);border-radius:var(--il-radius-0)"></div><div class="lbl">0px</div><div class="hex">Buttons, inputs, dark panels</div></div><div style="width:120px"><div style="height:60px;background:var(--il-grey-100);border:1px solid var(--il-line-strong);border-radius:var(--il-radius-sm)"></div><div class="lbl">4px</div><div class="hex">Alerts</div></div><div style="width:120px"><div style="height:60px;background:var(--il-grey-100);border:1px solid var(--il-line-strong);border-radius:var(--il-radius-md)"></div><div class="lbl">8px</div><div class="hex">Metric tiles</div></div><div style="width:120px"><div style="height:60px;background:var(--il-grey-100);border:1px solid var(--il-line-strong);border-radius:var(--il-radius-lg)"></div><div class="lbl">12px</div><div class="hex">Cards, media</div></div><div style="width:120px"><div style="height:60px;background:var(--il-grey-100);border:1px solid var(--il-line-strong);border-radius:var(--il-radius-pill)"></div><div class="lbl">999px</div><div class="hex">Prompt field, avatars</div></div>
</div></body></html>
