<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--il-grey-050)"></div><div class="lbl">Grey 050</div><div class="hex">--il-grey-050</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-100)"></div><div class="lbl">Grey 100</div><div class="hex">--il-grey-100</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-200)"></div><div class="lbl">Grey 200</div><div class="hex">--il-grey-200</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-300)"></div><div class="lbl">Grey 300</div><div class="hex">--il-grey-300</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-400)"></div><div class="lbl">Grey 400</div><div class="hex">--il-grey-400</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-500)"></div><div class="lbl">Grey 500</div><div class="hex">--il-grey-500</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-600)"></div><div class="lbl">Grey 600</div><div class="hex">--il-grey-600</div></div><div class="sw"><div class="chip" style="background:var(--il-grey-700)"></div><div class="lbl">Grey 700</div><div class="hex">--il-grey-700</div></div>
</div></body></html>
