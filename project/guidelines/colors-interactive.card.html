<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--il-blue-700)"></div><div class="lbl">Blue 700</div><div class="hex">--il-blue-700</div></div><div class="sw"><div class="chip" style="background:var(--il-blue-500)"></div><div class="lbl">Blue 500</div><div class="hex">--il-blue-500</div></div><div class="sw"><div class="chip" style="background:var(--il-blue-300)"></div><div class="lbl">Blue 300</div><div class="hex">--il-blue-300</div></div><div class="sw"><div class="chip" style="background:var(--il-blue-050)"></div><div class="lbl">Blue 050</div><div class="hex">--il-blue-050</div></div><div class="sw"><div class="chip" style="background:var(--il-teal-600)"></div><div class="lbl">Teal 600</div><div class="hex">--il-teal-600</div></div><div class="sw"><div class="chip" style="background:var(--il-teal-500)"></div><div class="lbl">Teal 500</div><div class="hex">--il-teal-500</div></div><div class="sw"><div class="chip" style="background:var(--il-teal-300)"></div><div class="lbl">Teal 300</div><div class="hex">--il-teal-300</div></div><div class="sw"><div class="chip" style="background:var(--il-teal-050)"></div><div class="lbl">Teal 050</div><div class="hex">--il-teal-050</div></div>
</div></body></html>
