<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Success, warning (gold does double duty), danger, info" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--il-font-body);background:var(--il-white)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:100px}
.chip{height:56px;border-radius:var(--il-radius-md);border:1px solid rgba(0,0,0,.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:6px;color:var(--il-ink-900)}
.hex{font-family:var(--il-font-mono);font-size:10px;color:var(--il-text-muted)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--il-success)"></div><div class="lbl">Success</div><div class="hex">--il-success</div></div><div class="sw"><div class="chip" style="background:var(--il-warning)"></div><div class="lbl">Warning</div><div class="hex">--il-warning</div></div><div class="sw"><div class="chip" style="background:var(--il-danger)"></div><div class="lbl">Danger</div><div class="hex">--il-danger</div></div><div class="sw"><div class="chip" style="background:var(--il-info)"></div><div class="lbl">Info</div><div class="hex">--il-info</div></div>
</div></body></html>
